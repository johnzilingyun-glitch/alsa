version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alsa}:${POSTGRES_PASSWORD:-alsa}@postgres:5432/${POSTGRES_DB:-alsadb}
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_BASE_URL=http://searxng:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./.env:/app/.env
      - ./.env.runtime:/app/.env.runtime
      - ./data:/app/data
    networks:
      - alsa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - PYTHON_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - ./.env.runtime:/app/.env.runtime
    networks:
      - alsa_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alsa}:${POSTGRES_PASSWORD:-alsa}@postgres:5432/${POSTGRES_DB:-alsadb}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./.env:/app/.env
      - ./.env.runtime:/app/.env.runtime
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
    networks:
      - alsa_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Bound to localhost only — do not expose publicly.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Internal instance URL (used by SearXNG for self-links).
      - SEARXNG_BASE_URL=http://localhost:8080/
      # Route outbound search traffic through the host privoxy -> SOCKS5
      # overseas proxy (privoxy listens on the host's :8118).
      - HTTP_PROXY=http://host.docker.internal:8118
      - HTTPS_PROXY=http://host.docker.internal:8118
      - NO_PROXY=localhost,127.0.0.1
    # Resolve host.docker.internal to the host gateway so the container can
    # reach the host's privoxy on :8118 from any Docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Canonical, version-controlled SearXNG config (see config/searxng/).
      - ./config/searxng:/etc/searxng:rw
    networks:
      - alsa_network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alsa_network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alsa}
      POSTGRES_DB: ${POSTGRES_DB:-alsadb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alsa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alsa} -d ${POSTGRES_DB:-alsadb}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  alsa_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
