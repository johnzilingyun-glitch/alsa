version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./.env:/app/.env
      - ./.env.runtime:/app/.env.runtime
      - ./data:/app/data
    networks:
      - alsa_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - PYTHON_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./.env:/app/.env
      - ./.env.runtime:/app/.env.runtime
    networks:
      - alsa_network

networks:
  alsa_network:
    driver: bridge
