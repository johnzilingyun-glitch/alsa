[project]
name = "alsa-python-service"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "polars",
    "duckdb",
    "lancedb",
    "yfinance",
    "celery",
    "redis",
    "sqlmodel",
    "pydantic",
    # Pinned to mootdx's required range (mootdx requires httpx>=0.25.0,<0.26.0);
    # 0.27+ removed the `proxies=` arg and would break it. Backend only uses
    # httpx.AsyncClient(timeout=...), which is stable across this range.
    "httpx>=0.25.0,<0.26.0",
    "click",
    "python-dotenv",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    # Pinned: passlib 1.7.4 is incompatible with bcrypt>=4.1 (removed bcrypt.__about__),
    # which breaks password verification (verify_password raises AttributeError).
    "bcrypt==4.0.1",
    "openai",
    "anthropic",
    "jinja2",
    "pyyaml",
    "markdown2",
    "openbb",
    "ddgs>=9.0.0",
    "google-genai>=2.7.0",
    "langgraph>=1.2.4",
    "mem0ai>=2.0.4",
    "structlog>=24.0",
    "slowapi>=0.1.9",
    "numpy",
    "tushare",
    "sqlalchemy",
    "pytest",
    "pytest-asyncio",
    "thsdk",
    # a-stock-data skill (skills/a-stock-data) runtime deps
    "mootdx>=0.11.7",
    "stockstats>=0.6.8",
]

[project.scripts]
alsacli = "cli:cli"

[tool.setuptools]
packages = ["app"]
