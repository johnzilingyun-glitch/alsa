provider_order:
  A-Share:
    - a-stock-direct
    - yfinance
    - thsdk
    - sina
    - iwencai
  HK-Share:
    - yfinance
    - a-stock-direct
  # US: a-stock-direct added as keyless fallback (Tencent quotes) — yfinance
  # is rate-limited from datacenter IPs (2026-08 incident).
  US-Share:
    - yfinance
    - a-stock-direct
  Unknown:
    - yfinance
    - a-stock-direct

quality_thresholds:
  quote:
    default: 0.5
    A-Share: 0.6
    HK-Share: 0.55
    US-Share: 0.55
  history:
    default: 0.55
    A-Share: 0.6
    HK-Share: 0.55
    US-Share: 0.55
  financial:
    default: 0.35
    A-Share: 0.4
    HK-Share: 0.35
    # US: lowered to 0.2 — Tencent fallback (keyless) supplies PE/market cap
    # only (no PB/ROE/revenue), scoring 2/8=0.25. Accept degraded data rather
    # than failing entirely when yfinance is rate-limited.
    US-Share: 0.2

cache_ttl_seconds:
  quote:
    A-Share: 3
    HK-Share: 5
    US-Share: 8
    Unknown: 5
  history:
    1m: 20
    5m: 45
    15m: 90
    30m: 180
    60m: 300
    1d: 900
    default: 120
  financial:
    A-Share: 3600
    HK-Share: 5400
    US-Share: 7200
    Unknown: 3600

flags:
  enforce_quality_threshold: true
  enable_history_redis_cache: true
  enable_financial_ttl_cache: true
